name: "Backend CI Trigger: PR"

on:
  pull_request:
    paths:
      - ".github/workflows/**.yml"
      - "!.github/workflows/frontend-*.yml"
      - "backend/**/*.ini"
      - "backend/**/*.py"
      - "backend/**/*.pyi"
      - "backend/**/*.toml"
      - "backend/**/*.yaml"
      - "backend/**/*.yml"

jobs:
  test:
    uses: ./.github/workflows/backend-test.yml
