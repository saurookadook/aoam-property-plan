name: "Frontend CI Trigger: 'main' branch"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**.yml"
      - "!.github/workflows/backend-*.yml"
      - "frontend/src/**/*"
      - "frontend/*.yaml"
      - "frontend/*.json"
      - "frontend/*.js"
      - "frontend/*.ts"

jobs:
  test:
    uses: ./.github/workflows/frontend-test.yml
