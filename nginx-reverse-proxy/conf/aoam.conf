upstream db {
    server pg_database:5432;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 80;
    listen [::]:80;

    server_name aoam.dev;

    ssl_certificate /etc/nginx/ssl/aoam.dev+4.pem;
    ssl_certificate_key /etc/nginx/ssl/aoam.dev+4-key.pem;

    location /api {
        proxy_pass http://backend:3000/api;
    }

    # TODO: add later when frontend is ready
    # location / {
    #     proxy_pass http://frontend:8080/;
    # }

    # location / {
    #     return 301 http://client/app;
    # }
}

