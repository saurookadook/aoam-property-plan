upstream db {
    server pg_database:5432;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    listen 80;
    listen [::]:80;

    server_name aoam.dev;

    ssl_certificate /etc/nginx/ssl/aoam.dev+4.pem;
    ssl_certificate_key /etc/nginx/ssl/aoam.dev+4-key.pem;

    proxy_buffers 16 4k;
    proxy_buffer_size 2k;

    proxy_bind $server_addr;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    location /api {
        proxy_pass http://backend:3000/api;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_pass http://frontend:5173/;

        ###################### NOTE ######################
        # Just keeping these because they might be useful at some point?
        ##################################################
        # root /etc/nginx/html;
        # index index.html;
        # try_files $uri $uri/ /index.html;
    }

    # location / {
    #     return 301 http://client/app;
    # }
}

