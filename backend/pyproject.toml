[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "fastapi>=0.136.1",
    "nltk>=3.9.4",
    "oauthlib>=3.3.1",
    "pydantic>=2.13.4",
    "pymemcache>=4.0.0",
    "python-dotenv>=1.2.2",
    "requests>=2.34.1",
    "scrapy>=2.15.2",
    "sqlalchemy>=2.0.49",
    "vadersentiment>=3.3.2",
]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "factory-boy>=3.3.3",
    "flake8>=7.3.0",
    "httpx>=0.28.1",
    "pygments>=2.20.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.15.1",
    "pytest-sugar>=1.1.1",
    "pytest-xdist>=3.8.0",
    "requests-mock>=1.12.1",
    "rich>=15.0.0",
    "scrapy-splash>=0.11.1",
]

[tool.setuptools]
packages = ["backend"]

[tool.setuptools.package-dir]
backend = "backend"
