# ###### In case you forget...
# :ro === :readonly
# for each 'ports' entry -> HOST_PORT:CONTAINER_PORT

services:
  all:
    image: alpine
    command: sh -c "echo start"
    platform: linux/amd64
    depends_on:
      - backend
      - frontend
      # - memcached
      - nginx

  nginx:
    build:
      context: .
      dockerfile: nginx-reverse-proxy/Dockerfile
    links:
      - frontend
      - backend
    # network_mode: host
    networks:
      - main_app
      - scraper
    platform: linux/amd64
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      # TODO: revisit whether this is necessary once the frontend and backend have been established
      # - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./nginx-reverse-proxy/conf/:/etc/nginx/conf.d/:ro
      - ./nginx-reverse-proxy/certs/:/etc/nginx/ssl/:ro
      # Assets to be served by NGINX
      - ./frontend/dist/:/etc/nginx/html/
      - ./frontend/index.html/:/etc/nginx/html/index.html

  pg_database:
    # image: postgres:16.2-bullseye # higher than this?
    build:
      context: postgres
      dockerfile: Dockerfile
    env_file: .env
    environment:
      POSTGRES_PASSWORD: example
    networks:
      - main_app
      # - scraper
    platform: linux/amd64
    ports:
      - 5432:5432
    volumes:
      - ./postgres/scripts/db:/opt/scripts/db
      - db_volume:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: backend-dev
    depends_on:
      - pg_database
      # - memcached
    env_file: .env
    environment:
      COLUMNS: ${COLUMNS}
      HOST: ${HOST}
      PORT: ${PORT}
      WORKERS: 1
    networks:
      - main_app
    platform: linux/amd64
    ports:
      - "3000:3000"
    volumes:
      - ./_research:/opt/aoam-property-plan/_research
      - ./backend/api:/opt/aoam-property-plan/backend/api
      - ./backend/config:/opt/aoam-property-plan/backend/config
      - ./backend/constants:/opt/aoam-property-plan/backend/constants
      - ./backend/db:/opt/aoam-property-plan/backend/db
      - ./backend/models:/opt/aoam-property-plan/backend/models
      - ./backend/scripts:/opt/aoam-property-plan/backend/scripts
      - ./backend/services:/opt/aoam-property-plan/backend/services
      - ./backend/utils:/opt/aoam-property-plan/backend/utils
      # - ~/.aws:/home/nlpstocksaapp/.aws:ro

  backend-migrations:
    build:
      target: backend-migrations
    extends: backend

  backend-scripts:
    build:
      target: backend-scripts
    extends: backend

  backend-test:
    build:
      target: backend-test
    environment:
      DATABASE_NAME: test_aoam_property_plan
      ENV: test
    extends: backend
    volumes:
      - ./backend/_factories:/opt/aoam-property-plan/backend/_factories
      - ./backend/_fixtures:/opt/aoam-property-plan/backend/_fixtures
      - ./backend/_mocks:/opt/aoam-property-plan/backend/_mocks

  backend-release:
    build:
      context: .
      dockerfile: backend/Dockerfile.release
      target: backend-release-app
    environment:
      DATABASE_NAME: aoam_property_plan
      ENV: production
    extends: backend

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: frontend-dev
    env_file: .env
    environment:
      EXAMPLE: woof
    networks:
      - main_app
    platform: linux/amd64
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/opt/aoam-property-plan/frontend/src:ro
      - ./frontend/.nvmrc:/opt/aoam-property-plan/frontend/.nvmrc:ro
      - ./frontend/package.json:/opt/aoam-property-plan/frontend/package.json:ro
      - ./frontend/pnpm-lock.yaml:/opt/aoam-property-plan/frontend/pnpm-lock.yaml:ro
      - ./frontend/pnpm-workspace.yaml:/opt/aoam-property-plan/frontend/pnpm-workspace.yaml:ro
      - ./frontend/tsconfig.app.json:/opt/aoam-property-plan/frontend/tsconfig.app.json:ro
      - ./frontend/tsconfig.common.json:/opt/aoam-property-plan/frontend/tsconfig.common.json:ro
      - ./frontend/tsconfig.json:/opt/aoam-property-plan/frontend/tsconfig.json:ro
      - ./frontend/tsconfig.node.json:/opt/aoam-property-plan/frontend/tsconfig.node.json:ro
      - ./frontend/tsconfig.test.json:/opt/aoam-property-plan/frontend/tsconfig.test.json:ro
      - ./frontend/vite.config.ts:/opt/aoam-property-plan/frontend/vite.config.ts:ro
      - /opt/aoam-property-plan/frontend/node_modules
      # - ~/.aws:/home/nlpstocksaapp/.aws:ro

  frontend-test:
    build:
      target: frontend-test
    extends: frontend
    volumes:
      - ./frontend/vitest.setup.ts:/opt/aoam-property-plan/frontend/vitest.setup.ts:ro
      - ./frontend/vitest.shims.d.ts:/opt/aoam-property-plan/frontend/vitest.shims.d.ts:ro

  # TODO: if we ever need it?
